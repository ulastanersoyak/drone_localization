# pole_tracking_sim's ROS parameters, for generate_parameter_library: it
# generates the C++ that declares, describes and checks them
# (`ros2 param describe /pole_tracking_sim <name>`). sim/run_pole.sh turns
# --name value into name:=value; the launch file gives doubles their
# decimal point (localization_core airsim/launch/ros_params.py).
# The flight (radius, altitude, altitude_swing) is the autopilot's:
# localization_core airsim/autopilot.py.
pole_tracking_sim_parameters:
  no_gps:
    type: bool
    default_value: false
    description: "do not use the GPS"
    read_only: true
  no_imu:
    type: bool
    default_value: false
    description: "do not use the IMU"
    read_only: true
  duration:
    type: double
    default_value: 0.0
    description: "stop after this many seconds of flight (0: at Ctrl-C)"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  latency:
    type: double
    default_value: 0.4
    description: "fuse measurements this far behind the simulation, seconds"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  wait_for_detector:
    type: bool
    default_value: true
    description: "stay on the ground until the first detection arrives (YOLO takes seconds to start); the flight, the duration and the published estimates start then"
    read_only: true
  seed:
    type: int
    default_value: 1
    description: "noise seed"
    read_only: true
    validation:
      gt_eq<>: [0]

  # The pole: its UWB anchor and pan-tilt camera.
  uwb_noise:
    type: double
    default_value: 0.1
    description: "UWB range noise, metres"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  fixed_camera:
    type: bool
    default_value: false
    description: "keep the pole camera in its rest pose instead of turning it towards the drone"
    read_only: true
  slew_rate:
    type: double
    default_value: 120.0
    description: "pan-tilt speed limit, degrees per second"
    read_only: true
    validation:
      gt<>: [0.0]
  camera:
    type: string
    default_value: "pole"
    description: "the pole camera's name in the AirSim settings"
    read_only: true
    validation:
      not_empty<>: []

  # The drone's GPS and IMU, with the same error model as positioning_sim
  # in gnss_imu_prediction.
  gps_noise:
    type: double
    default_value: 1.5
    description: "white GPS position noise, metres"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  gps_vfactor:
    type: double
    default_value: 1.7
    description: "altitude noise relative to the horizontal"
    read_only: true
    validation:
      gt<>: [0.0]
  speed_noise:
    type: double
    default_value: 0.05
    description: "GPS velocity noise, m/s"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  accel_bias:
    type: double
    default_value: 0.02
    description: "accelerometer bias per axis, m/s^2"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  tilt_error:
    type: double
    default_value: 0.2
    description: "roll/pitch error, degrees"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  heading_error:
    type: double
    default_value: 1.0
    description: "heading error, degrees"
    read_only: true
    validation:
      gt_eq<>: [0.0]
  orientation_error_tau:
    type: double
    default_value: 30.0
    description: "orientation error correlation time, seconds"
    read_only: true
    validation:
      gt<>: [0.0]

  origin_latitude:
    type: double
    default_value: 39.97656
    description: "the enu frame's origin: AirSim's OriginGeopoint (the launch file passes it)"
    read_only: true
    validation:
      bounds<>: [-90.0, 90.0]
  origin_longitude:
    type: double
    default_value: 32.73812
    description: "see origin_latitude"
    read_only: true
    validation:
      bounds<>: [-180.0, 180.0]
  origin_altitude:
    type: double
    default_value: 894.0
    description: "see origin_latitude"
    read_only: true
